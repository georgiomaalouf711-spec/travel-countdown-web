<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Travel Countdown</title>
<meta name="description" content="Countdowns to your next trips.">
<meta name="theme-color" content="#0b1226">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Countdown">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script>try{var t=JSON.parse(localStorage.getItem('travelCountdown.settings')||'{}').theme||localStorage.getItem('travelCountdown.theme')||'auto';document.documentElement.dataset.theme=t==='auto'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):t}catch(e){}</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="sky" aria-hidden="true">
  <i class="sun"></i>
  <svg class="route" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice">
    <path id="rp" class="trail" d="M-30 700C90 470 250 650 430 140"/>
    <path class="jet" d="M9 0-7-5.5-3.5 0-7 5.5Z"><animateMotion dur="46s" repeatCount="indefinite" rotate="auto"><mpath href="#rp"/></animateMotion></path>
  </svg>
</div>
<div class="app">
  <header class="top">
    <div><p class="eyebrow">✈ Departures</p><h1>Travel Countdown</h1></div>
    <div class="tools">
      <button id="modeBtn" class="chip" type="button" aria-label="Change display mode">Full</button>
      <button id="shareBtn" class="icon" type="button" aria-label="Share trips">⇪</button>
      <button id="setBtn" class="icon" type="button" aria-label="Settings">⚙</button>
    </div>
  </header>
  <div id="hint" class="hint" hidden><span id="hintText"></span><button id="hintAct" type="button" hidden>Install</button><button id="hintX" type="button" aria-label="Dismiss">×</button></div>
  <main id="list"></main>
  <section id="empty" class="empty" hidden>
    <div class="plane" aria-hidden="true">✈</div>
    <h2>Where to next?</h2>
    <p>Add a trip and watch the days tick down.</p>
    <button class="btn" type="button" data-add>Add your first trip</button>
  </section>
</div>
<button id="fab" class="fab" type="button" aria-label="Add trip" data-add>+</button>
<div id="toast" class="toast" role="status"></div>

<dialog id="sheet" aria-labelledby="sheetTitle">
  <form id="form" autocomplete="off">
    <div class="grab" aria-hidden="true"></div>
    <h2 id="sheetTitle">New trip</h2>
    <label>Destination<input id="dest" type="text" placeholder="Where to next?" required maxlength="80"></label>
    <div class="two">
      <label>Departure<input id="dep" type="datetime-local" required></label>
      <label>Return <small>(optional)</small><input id="ret" type="datetime-local"></label>
    </div>
    <label>Time zone <small>(optional — shows local time there)</small><input id="tz" type="text" list="tzs" placeholder="e.g. Asia/Beirut" autocapitalize="off" spellcheck="false"></label>
    <label>Background photo
      <span class="photo"><span id="prev" class="prev"></span><input id="photo" type="file" accept="image/*"></span>
    </label>
    <div class="acts">
      <button class="btn" type="submit">Save trip</button>
      <button class="btn ghost" type="button" id="cancel" formnovalidate>Cancel</button>
    </div>
    <button class="danger" type="button" id="del" hidden>Delete this trip</button>
  </form>
</dialog>
<datalist id="tzs"></datalist>
<canvas id="fx" class="fx" hidden aria-hidden="true"></canvas>

<dialog id="detail" class="full" aria-labelledby="dTitle">
  <div class="dhero" id="dHero"><div class="veil"></div>
    <div class="dbody">
      <div class="dhead"><button class="icon" id="dClose" type="button" aria-label="Back">←</button><div><p class="eyebrow" id="dTag"></p><h2 id="dTitle"></h2></div><button class="chip" id="dEdit" type="button">Edit</button></div>
      <div class="units" id="dUnits" title="Tap to change style"></div>
      <p class="hype" id="dHype"></p>
    </div>
  </div>
  <div class="facts" id="dFacts"></div>
  <section class="panel" id="dClockP" hidden><h3>Local time there</h3><p id="dClock" class="clock"></p></section>
  <section class="panel">
    <div class="ph"><h3>Packing list</h3><span id="pCount"></span></div>
    <div class="pbar"><i id="pBar"></i></div>
    <ul id="pList"></ul>
    <form id="pForm"><input id="pIn" type="text" placeholder="Add an item" maxlength="60"><button class="btn sm" type="submit">Add</button></form>
    <button class="link" id="pSeed" type="button">+ Add travel essentials</button>
  </section>
  <section class="panel"><h3>Notes</h3><textarea id="dNotes" rows="4" placeholder="Booking refs, addresses, ideas…"></textarea></section>
  <div class="dacts"><button class="btn ghost" id="dIcs" type="button">Add to calendar</button><button class="btn ghost" id="dShare" type="button">Share trip</button></div>
</dialog>

<dialog id="settings" aria-labelledby="sTitle">
  <div class="sform">
    <div class="grab" aria-hidden="true"></div><h2 id="sTitle">Settings</h2>
    <h3 class="grp">Appearance</h3>
    <div class="set"><span>Theme</span><div class="seg" data-k="theme"><button type="button" data-v="auto">Auto</button><button type="button" data-v="dark">Dark</button><button type="button" data-v="light">Light</button></div></div>
    <div class="set"><span>Accent</span><div class="seg sw" data-k="accent"><button type="button" data-v="amber" style="--c:#ffb454" aria-label="Amber"></button><button type="button" data-v="coral" style="--c:#ff7a6b" aria-label="Coral"></button><button type="button" data-v="teal" style="--c:#4fd1c5" aria-label="Teal"></button><button type="button" data-v="lilac" style="--c:#b79cff" aria-label="Lilac"></button><button type="button" data-v="mint" style="--c:#7bdc8a" aria-label="Mint"></button></div></div>
    <div class="set"><span>Countdown style</span><div class="seg" data-k="mode"><button type="button" data-v="full">Full</button><button type="button" data-v="days">Days</button><button type="button" data-v="hm">Hrs·Min</button></div></div>
    <label class="set"><span>Animated background &amp; confetti</span><input class="tgl" type="checkbox" data-k="fx"></label>
    <h3 class="grp">Dates &amp; time</h3>
    <div class="set"><span>Date format</span><div class="seg" data-k="datefmt"><button type="button" data-v="auto">Auto</button><button type="button" data-v="dmy">D/M/Y</button><button type="button" data-v="mdy">M/D/Y</button><button type="button" data-v="iso">ISO</button></div></div>
    <div class="set"><span>Clock</span><div class="seg" data-k="time"><button type="button" data-v="auto">Auto</button><button type="button" data-v="12">12h</button><button type="button" data-v="24">24h</button></div></div>
    <h3 class="grp">Alerts &amp; feel</h3>
    <label class="set"><span>Milestone alerts<small>100 days, 30, 7, tomorrow, departure. Delivered when the app is open or in the background.</small></span><input class="tgl" type="checkbox" data-k="notify"></label>
    <button class="btn ghost" id="nTest" type="button">Send a test alert</button>
    <label class="set"><span>Haptic feedback</span><input class="tgl" type="checkbox" data-k="haptics"></label>
    <h3 class="grp">Your data</h3>
    <div class="acts2"><button class="btn ghost" id="bkExport" type="button">Export backup</button><label class="btn ghost filebtn">Import backup<input id="bkImport" type="file" accept="application/json" hidden></label></div>
    <button class="danger" id="bkReset" type="button">Reset everything</button>
    <button class="btn" id="sDone" type="button">Done</button>
  </div>
</dialog>
<script src="script.js" defer></script>
</body>
</html>
